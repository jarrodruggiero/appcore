[project]
name = "appcore"
version = "0.1.0"
description = "Shared foundation for the self-hosted app suite."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"

dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",          # the app factory's template environment
    "sqlalchemy>=2.0",
    "alembic>=1.13",        # migrations, run at startup by `upgrade_to_head`
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",          # what pydantic-settings reads config.yaml with
    "pyjwt[crypto]>=2.9",   # ID token verification; the extra brings cryptography
]

[project.optional-dependencies]
# `appcore.testing` needs the key generation, which comes with pyjwt[crypto].
# Separate so an application that does not federate need not install it.
testing = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["appcore"]

[tool.ruff]
target-version = "py312"
# Matching the applications rather than choosing afresh: a shared library whose
# lint settings differ from its consumers' produces diffs that fail in one repo
# and pass in the other.
line-length = 100

[tool.ruff.lint]
# Ruff's defaults plus import ordering, as in the applications. Deliberately
# not the whole of `E`: line-length is a formatting argument, and CI is not
# where formatting arguments belong.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["appcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["appcore"]
branch = true
