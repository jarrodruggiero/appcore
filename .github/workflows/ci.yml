# Lint and test on every push and pull request.
#
# This is a library: it has no database of its own, no browser to drive and no
# image to build, so the matrix is only the Python versions the package claims
# to support. The two-way part — running the applications' suites against a
# change here — is a separate workflow, added when the first consumer pins it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project and its dev tools
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check appcore tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject says `requires-python = ">=3.12"`, so every version that
        # claim covers is tested. Narrow the claim if one has to be dropped;
        # do not quietly stop testing it.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install the project and its dev tools
        run: uv sync --dev

      - name: Test (python ${{ matrix.python }})
        run: uv run pytest
